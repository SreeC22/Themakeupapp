openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /neu/research:
    get:
      operationId: getNeuResearch
      tags: [neu]
      summary: Curated public-source observations, not public reviews or popularity claims
      responses:
        "200":
          description: Dated research candidates with explicit evidence limitations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NeuResearch" }
        "503": { $ref: "#/components/responses/CatalogUnavailable" }
  /neu/catalog:
    get:
      operationId: getNeuCatalog
      tags: [neu]
      summary: Reviewed US product lines and source-backed shade observations, never live stock
      responses:
        "200":
          description: Current curated development catalog with evidence and coverage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NeuCatalog" }
        "503": { $ref: "#/components/responses/CatalogUnavailable" }
  /neu/recommendations:
    post:
      operationId: recommendNeuShades
      tags: [neu]
      summary: Explainable descriptor-based candidates; submitted traits are not stored
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NeuProfileInput" }
      responses:
        "200":
          description: Evidence-bounded suggestions across all four categories, without fit percentages
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NeuRecommendations" }
        "400": { $ref: "#/components/responses/CatalogBadRequest" }
        "503": { $ref: "#/components/responses/CatalogUnavailable" }
  /catalog/brands:
    get:
      operationId: listCatalogBrands
      tags: [catalog]
      summary: Search canonical brands, with unreviewed candidates available through scope=discovered
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Retailer"
        - $ref: "#/components/parameters/Division"
        - $ref: "#/components/parameters/Category"
        - $ref: "#/components/parameters/Scope"
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100000, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Paginated canonical brands with coverage metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogBrandPage" }
        "400": { $ref: "#/components/responses/CatalogBadRequest" }
        "503": { $ref: "#/components/responses/CatalogUnavailable" }
  /catalog/brands/{brandId}:
    get:
      operationId: getCatalogBrand
      tags: [catalog]
      summary: Brand listings, complete unknown-aware category matrix and evidence history
      parameters:
        - name: brandId
          in: path
          required: true
          schema: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
      responses:
        "200":
          description: Brand with current offerings and retained verification history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogBrandDetail" }
        "400": { $ref: "#/components/responses/CatalogBadRequest" }
        "404":
          description: Unknown canonical brand
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogError" }
        "503": { $ref: "#/components/responses/CatalogUnavailable" }
  /catalog/counts:
    get:
      operationId: getCatalogCounts
      tags: [catalog]
      summary: Distinct observed and verified counts, never US market totals
      description: Division counts overlap and must not be added. All category/division counts use latest verified product evidence, scoped to the selected retailer. Directory candidates include unreviewed and potentially irrelevant brands.
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Retailer"
        - $ref: "#/components/parameters/Division"
        - $ref: "#/components/parameters/Category"
        - $ref: "#/components/parameters/Scope"
      responses:
        "200":
          description: Filtered distinct counts and research coverage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogCounts" }
        "400": { $ref: "#/components/responses/CatalogBadRequest" }
        "503": { $ref: "#/components/responses/CatalogUnavailable" }
  /catalog/coverage:
    get:
      operationId: getCatalogCoverage
      tags: [catalog]
      summary: Source universe, as-of dates, inclusion rules and gaps across research batches
      responses:
        "200":
          description: Partial research coverage with retained batch history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogCoverage" }
        "503": { $ref: "#/components/responses/CatalogUnavailable" }
  /catalog/taxonomy:
    get:
      operationId: getCatalogTaxonomy
      tags: [catalog]
      summary: Stable Neu division and category identifiers
      responses:
        "200":
          description: Five divisions, 22 categories and known US retailers
          content:
            application/json:
              schema:
                type: object
                required: [divisions, categories, retailers]
                properties:
                  divisions: { type: array, items: { $ref: "#/components/schemas/CatalogDivision" } }
                  categories: { type: array, items: { $ref: "#/components/schemas/CatalogCategory" } }
                  retailers: { type: array, items: { $ref: "#/components/schemas/CatalogRetailer" } }
        "503": { $ref: "#/components/responses/CatalogUnavailable" }
  /catalog/export.csv:
    get:
      operationId: exportCatalogCsv
      tags: [catalog]
      summary: Download matching brands and unknown-aware retailer/category rows
      description: UTF-8 CSV with BOM. First row after headers is a summary record containing filtered counts, source universe, dates and gaps in summary_json. Remaining records contain offerings with public source links. Spreadsheet formula prefixes are neutralized. Pagination is not applied.
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Retailer"
        - $ref: "#/components/parameters/Division"
        - $ref: "#/components/parameters/Category"
        - $ref: "#/components/parameters/Scope"
      responses:
        "200":
          description: CSV summary and coverage rows
          content:
            text/csv:
              schema: { type: string }
        "400": { $ref: "#/components/responses/CatalogBadRequest" }
        "503": { $ref: "#/components/responses/CatalogUnavailable" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  parameters:
    Search:
      name: q
      in: query
      description: Literal case-insensitive substring of canonical name or explicit alias
      schema: { type: string, maxLength: 100 }
    Retailer:
      name: retailer
      in: query
      description: Known retailer ID from taxonomy; unknown IDs return 400
      schema: { type: string }
    Division:
      name: division
      in: query
      schema: { type: string, enum: [complexion, cheeks, eyes-brows, lips, prep-finish] }
    Category:
      name: category
      in: query
      description: Stable category ID from taxonomy; requires current verified offering
      schema:
        type: string
        enum: [foundation, concealer, color-corrector, skin-tint, setting-powder, primer, blush, bronzer, contour, highlighter, eyeshadow, eyeliner, mascara, brow-pencil, brow-gel, lipstick, lip-liner, lip-gloss, lip-balm, moisturizer, sunscreen, setting-spray]
    Scope:
      name: scope
      in: query
      description: Relevant requires a verified Neu offering. Discovered includes all unreviewed directory candidates; category/division filters still require positive evidence.
      schema: { type: string, enum: [relevant, discovered], default: relevant }
  responses:
    CatalogBadRequest:
      description: Invalid or unknown filter, repeated query parameter or incompatible category/division
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CatalogError" }
    CatalogUnavailable:
      description: Catalog database unavailable; no placeholder counts are returned
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CatalogError" }
  schemas:
    NeuClaim:
      type: object
      required: [field, value, basis, sourceUrl, checkedOn, rawText]
      properties:
        field: { type: string }
        value: { type: string }
        basis: { type: string, enum: [verified, estimate, user_report] }
        sourceUrl: { type: string }
        checkedOn: { type: string }
        rawText: { type: string }
    NeuBrand:
      type: object
      required: [id, name, tier, candidate]
      properties:
        id: { type: string }
        name: { type: string }
        tier: { type: string, enum: [Drugstore, Mid-range, Luxury] }
        candidate: { type: boolean }
    NeuProduct:
      type: object
      required: [id, brandId, name, category, sourceUrl, checkedOn, rangeStatus, declaredShadeCount, verifiedShadeCount, notes, claims]
      properties:
        id: { type: string }
        brandId: { type: string }
        name: { type: string }
        category: { type: string, enum: [Foundation, Concealer, Blush, Lips, Eyes, Multi-use, Setting] }
        applicationAreas: { type: array, items: { type: string } }
        routineRoles: { type: array, items: { type: string } }
        lipSubcategories: { type: array, items: { type: string } }
        versatility: { type: array, items: { type: string } }
        benefits: { type: array, items: { type: string } }
        combinationRoles: { type: array, items: { type: string } }
        sourceUrl: { type: string }
        checkedOn: { type: string }
        rangeStatus: { type: string, enum: [enumerated, partial, needs_review] }
        declaredShadeCount: { type: [integer, "null"] }
        verifiedShadeCount: { type: integer }
        notes: { type: array, items: { type: string } }
        claims: { type: array, items: { $ref: "#/components/schemas/NeuClaim" } }
    NeuResearch:
      type: object
      required: [entries, notes]
      properties:
        entries: { type: array, items: { $ref: "#/components/schemas/NeuResearchEntry" } }
        notes: { type: array, items: { type: string } }
    NeuResearchEntry:
      type: object
      required: [id, productName, shade, sourceUrl, observedOn, platform, reportedCharacteristics, positive, negative, routines, disclosure, strength, independentGroup, status]
      properties:
        id: { type: string }
        productName: { type: string }
        shade: { type: string }
        sourceUrl: { type: string }
        observedOn: { type: string }
        platform: { type: string }
        reportedCharacteristics: { type: array, items: { type: string } }
        positive: { type: array, items: { type: string } }
        negative: { type: array, items: { type: string } }
        routines: { type: array, items: { type: string } }
        disclosure: { type: string }
        strength: { type: string }
        independentGroup: { type: [string, "null"] }
        status: { type: string, enum: [research_candidate, supported_favorite] }
    NeuShade:
      type: object
      required: [id, productId, name, description, status, claims]
      properties:
        id: { type: string }
        productId: { type: string }
        name: { type: string }
        description: { type: string }
        status: { type: string, enum: [verified, needs_review] }
        claims: { type: array, items: { $ref: "#/components/schemas/NeuClaim" } }
    NeuCoverage:
      type: object
      required: [selectedBrands, verifiedBrands, verifiedProducts, verifiedShades, enumeratedRanges, targetProducts, targetShades, checkedOn, gaps]
      properties:
        selectedBrands: { type: integer }
        verifiedBrands: { type: integer }
        verifiedProducts: { type: integer }
        verifiedShades: { type: integer }
        enumeratedRanges: { type: integer }
        targetProducts: { type: string }
        targetShades: { type: string }
        checkedOn: { type: string }
        gaps: { type: array, items: { type: string } }
    NeuCatalog:
      type: object
      required: [brands, products, shades, coverage]
      properties:
        brands: { type: array, items: { $ref: "#/components/schemas/NeuBrand" } }
        products: { type: array, items: { $ref: "#/components/schemas/NeuProduct" } }
        shades: { type: array, items: { $ref: "#/components/schemas/NeuShade" } }
        coverage: { $ref: "#/components/schemas/NeuCoverage" }
    NeuReferenceInput:
      type: object
      required: [shadeId, fit]
      properties:
        shadeId: { type: string, maxLength: 200 }
        fit: { type: array, maxItems: 10, items: { type: string, maxLength: 100 } }
        oxidation: { type: string, maxLength: 200 }
    NeuCategoryPreference:
      type: object
      properties:
        coverage: { type: string, maxLength: 100 }
        finish: { type: string, maxLength: 100 }
        formula: { type: string, maxLength: 100 }
        intent: { type: string, maxLength: 100 }
        pigmentation: { type: string, maxLength: 100 }
        opacity: { type: string, maxLength: 100 }
        colorFamilies: { type: array, maxItems: 10, items: { type: string, maxLength: 100 } }
    NeuProfileInput:
      type: object
      properties:
        depth: { type: [string, "null"], enum: ["Very fair", Fair, Light, Light-medium, Medium, Tan, Deep, "Very deep", null] }
        undertone: { type: [string, "null"], enum: [Warm, Cool, Neutral, Olive, "Still exploring", null] }
        oliveSubtype: { type: string, enum: ["", Warm-olive, Cool-olive, Neutral-olive, "Not sure"] }
        saturation: { type: string, enum: ["", Muted, Balanced, "Bright / saturated", "Not sure"] }
        skinType: { type: string, enum: ["", Oily, Dry, Combination, Normal, Sensitive] }
        budget: { type: string, maxLength: 100 }
        references: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/NeuReferenceInput" } }
        preferences:
          type: object
          properties:
            Foundation: { $ref: "#/components/schemas/NeuCategoryPreference" }
            Concealer: { $ref: "#/components/schemas/NeuCategoryPreference" }
            Blush: { $ref: "#/components/schemas/NeuCategoryPreference" }
            Lips: { $ref: "#/components/schemas/NeuCategoryPreference" }
    NeuCandidate:
      type: object
      required: [shadeId, productId, category, label, reasons, limitations, sourceUrl, checkedOn]
      properties:
        shadeId: { type: string }
        productId: { type: string }
        category: { type: string, enum: [Foundation, Concealer, Blush, Lips] }
        label: { type: string, enum: ["Descriptor-aligned candidate", "Limited-evidence suggestion", "Color exploration"] }
        reasons: { type: array, items: { type: string } }
        limitations: { type: array, items: { type: string } }
        sourceUrl: { type: string }
        checkedOn: { type: string }
    NeuRecommendations:
      type: object
      required: [version, candidates, notes, excludedCount]
      properties:
        version: { type: string }
        candidates: { type: array, items: { $ref: "#/components/schemas/NeuCandidate" } }
        notes: { type: array, items: { type: string } }
        excludedCount: { type: integer }
    CatalogError:
      type: object
      required: [error]
      properties:
        error: { type: string }
    CatalogDivision:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    CatalogCategory:
      allOf:
        - $ref: "#/components/schemas/CatalogDivision"
        - type: object
          required: [divisionId]
          properties:
            divisionId: { type: string }
    CatalogRetailer:
      allOf:
        - $ref: "#/components/schemas/CatalogDivision"
        - type: object
          required: [country]
          properties:
            country: { type: string, const: US }
    CatalogCoverageRecord:
      type: object
      required: [batch_id, retailer_id, retailer_name, source_url, checked_on, status, inclusion_rules, gaps]
      properties:
        batch_id: { type: string }
        retailer_id: { type: string }
        retailer_name: { type: string }
        source_url: { type: string }
        checked_on: { type: string }
        status: { type: string, enum: [partial, blocked, reviewed] }
        inclusion_rules: { type: string }
        gaps: { type: array, items: { type: string } }
    CatalogCoverage:
      type: object
      required: [sourceUniverse, rules, verificationStatus, incomplete, asOfDates, divisionTotalsAdditive, records]
      properties:
        sourceUniverse: { type: string }
        rules: { type: string }
        verificationStatus: { type: string }
        incomplete: { type: boolean }
        asOfDates: { type: array, items: { type: string } }
        divisionTotalsAdditive: { type: boolean, const: false }
        records: { type: array, items: { $ref: "#/components/schemas/CatalogCoverageRecord" } }
    CatalogBrand:
      type: object
      required: [id, name, normalized_name, aliases, retailers, verified_categories]
      properties:
        id: { type: string }
        name: { type: string }
        normalized_name: { type: string }
        aliases: { type: array, items: { type: string } }
        retailers: { type: array, items: { type: string } }
        verified_categories:
          type: array
          description: All-retailer verified categories; filters select brands, not this context list
          items: { type: string }
    CatalogFilters:
      type: object
      properties:
        q: { type: string }
        retailer: { type: string }
        category: { type: string }
        division: { type: string }
        scope: { type: string, enum: [relevant, discovered] }
        page: { type: integer }
        limit: { type: integer }
    CatalogBrandPage:
      type: object
      required: [data, total, page, limit, filters, coverage]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/CatalogBrand" } }
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
        filters: { $ref: "#/components/schemas/CatalogFilters" }
        coverage: { $ref: "#/components/schemas/CatalogCoverage" }
    CatalogOffering:
      type: object
      required: [retailer_id, category_id, status]
      properties:
        id: { type: string }
        brand_id: { type: string }
        retailer_id: { type: string }
        category_id: { type: string }
        division_id: { type: string }
        status: { type: string, enum: [verified, unavailable, unknown] }
        source_url: { type: [string, "null"] }
        checked_on: { type: [string, "null"] }
        product_name: { type: [string, "null"] }
        product_url: { type: [string, "null"] }
        note: { type: [string, "null"] }
        batch_id: { type: [string, "null"] }
    CatalogListing:
      type: object
      required: [brand_id, retailer_id, source_url, checked_on, batch_id]
      properties:
        brand_id: { type: string }
        retailer_id: { type: string }
        source_url: { type: string }
        checked_on: { type: string }
        batch_id: { type: string }
    CatalogBrandDetail:
      type: object
      required: [id, name, normalized_name, aliases, listings, offerings, evidenceHistory, coverage]
      properties:
        id: { type: string }
        name: { type: string }
        normalized_name: { type: string }
        aliases: { type: array, items: { type: string } }
        listings: { type: array, items: { $ref: "#/components/schemas/CatalogListing" } }
        offerings: { type: array, items: { $ref: "#/components/schemas/CatalogOffering" } }
        evidenceHistory: { type: array, items: { $ref: "#/components/schemas/CatalogOffering" } }
        coverage: { $ref: "#/components/schemas/CatalogCoverage" }
    CatalogGroupCount:
      type: object
      required: [id, name, verified_brands]
      properties:
        id: { type: string }
        name: { type: string }
        verified_brands: { type: integer }
        discovered_brands: { type: integer }
    CatalogCounts:
      type: object
      required: [filters, listedBrands, discoveredDirectoryBrands, verifiedRelevantBrands, byRetailer, byDivision, byCategory, coverage]
      properties:
        filters: { $ref: "#/components/schemas/CatalogFilters" }
        listedBrands: { type: integer }
        discoveredDirectoryBrands:
          type: integer
          description: All observed directory candidates under search/retailer filters, regardless of relevance review. With category/division filters, requires verified evidence.
        verifiedRelevantBrands: { type: integer }
        byRetailer: { type: array, items: { $ref: "#/components/schemas/CatalogGroupCount" } }
        byDivision: { type: array, items: { $ref: "#/components/schemas/CatalogGroupCount" } }
        byCategory: { type: array, items: { $ref: "#/components/schemas/CatalogGroupCount" } }
        coverage: { $ref: "#/components/schemas/CatalogCoverage" }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

