<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neu — iOS app</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script src="./data.js"></script>
<style>
  html,body{margin:0;height:100%}
  body{background:var(--paper-sink);font-family:var(--font-body);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px 0}
  a{color:var(--link)}a:hover{color:var(--link-hover)}
  ::-webkit-scrollbar{width:0;height:0}
  [data-lucide]{stroke-width:2px}
</style></head>
<body>
<div id="root"></div>
<script type="text/babel" src="./NeuApp.jsx"></script>
<script type="text/babel" src="./QuizScreen.jsx"></script>
<script type="text/babel" src="./ResultScreen.jsx"></script>
<script type="text/babel" src="./FeedScreen.jsx"></script>
<script type="text/babel" src="./ProductScreen.jsx"></script>
<script type="text/babel" src="./ProfileScreen.jsx"></script>
<script type="text/babel" data-presets="react">
  const mount = () => {
    if (!window.NeuApp || !window.QuizScreen || !window.ProfileScreen) return setTimeout(mount, 40);
    ReactDOM.createRoot(document.getElementById('root')).render(<window.NeuApp/>);
    if (window.lucide) window.lucide.createIcons();
  };
  mount();
</script>
</body></html>
