<!-- @dsCard group="Brand" viewport="700x170" name="Cast vs undertone" subtitle="Cast = a product's surface flaw; undertone = your skin. Different things." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--paper);font-family:var(--font-body);padding:20px 22px;color:var(--ink)}
.lab{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:0 0 10px}
.row{display:flex;gap:12px}
.c{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.sw{width:100%;height:52px;border-radius:var(--r-md);border:1px solid var(--line)}
.n{font-size:12px;font-weight:600}
.v{font-family:var(--font-mono);font-size:9px;color:var(--ink-3)}
.note{font-size:12px;color:var(--ink-2);margin:14px 0 0;line-height:1.45}
.note b{color:var(--ink)}</style></head>
<body>
<p class="lab">Product cast — what verdicts flag</p>
<div class="row">
<div class="c"><div class="sw" style="background:var(--cast-white)"></div><div class="n">White cast</div><div class="v">SPF flashback</div></div>
<div class="c"><div class="sw" style="background:var(--cast-grey)"></div><div class="n">Grey / ashy</div><div class="v">wrong depth</div></div>
<div class="c"><div class="sw" style="background:var(--cast-orange)"></div><div class="n">Orange</div><div class="v">oxidized</div></div>
<div class="c"><div class="sw" style="background:var(--cast-pink)"></div><div class="n">Pink pull</div><div class="v">too cool</div></div>
</div>
<p class="note"><b>Cast</b> is a flaw a <b>product</b> leaves on the skin — separate from your <b>undertone</b>, which is your own skin's hue. Neu names both, but they are different colour systems.</p>
</body></html>
