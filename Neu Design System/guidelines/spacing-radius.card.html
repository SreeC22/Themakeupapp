<!-- @dsCard group="Spacing" viewport="700x150" name="Corner radii" subtitle="Soft & editorial — rounded, never bubbly" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--paper);padding:20px 24px;font-family:var(--font-mono);display:flex;gap:16px;align-items:flex-end}
.c{display:flex;flex-direction:column;align-items:center;gap:8px}
.b{width:72px;height:64px;background:var(--surface);border:1px solid var(--line-strong);box-shadow:var(--shadow-sm)}
.l{font-size:10px;color:var(--ink-3)}
.pill{width:96px;border-radius:var(--r-pill)}</style></head>
<body>
<div class="c"><div class="b" style="border-radius:var(--r-xs)"></div><span class="l">xs·6</span></div>
<div class="c"><div class="b" style="border-radius:var(--r-sm)"></div><span class="l">sm·10</span></div>
<div class="c"><div class="b" style="border-radius:var(--r-md)"></div><span class="l">md·14</span></div>
<div class="c"><div class="b" style="border-radius:var(--r-lg)"></div><span class="l">lg·20</span></div>
<div class="c"><div class="b" style="border-radius:var(--r-xl)"></div><span class="l">xl·28</span></div>
<div class="c"><div class="b pill"></div><span class="l">pill</span></div>
</body></html>
