<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--paper);padding:20px 24px;font-family:var(--font-mono);color:var(--ink);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.tag{background:var(--ink);color:var(--paper);padding:8px 12px;border-radius:var(--r-pill);font-size:13px;letter-spacing:.04em}
.lab{color:var(--ink-3);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.big{font-size:24px;letter-spacing:-.01em;color:var(--amethyst-deep)}</style></head>
<body>
<span class="tag">MST-05</span>
<span class="tag" style="background:var(--amethyst)">OLIVE</span>
<span class="big">MST-07 · WARM</span>
<span class="lab">your placement</span>
</body></html>
