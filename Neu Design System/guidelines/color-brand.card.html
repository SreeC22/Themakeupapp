<!-- @dsCard group="Colors" viewport="700x150" name="Brand hues" subtitle="Amethyst (the trust signal), lilac, berry & caramel" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--paper);font-family:var(--font-body);padding:20px;display:flex;gap:14px}
.col{flex:1;display:flex;flex-direction:column;gap:6px}
.sw{height:70px;border-radius:var(--r-md);display:flex;align-items:flex-end;padding:8px}
.n{font-size:12px;font-weight:600;color:var(--ink)}.v{font-family:var(--font-mono);font-size:10px;color:var(--ink-3)}
.soft{height:26px;border-radius:var(--r-sm)}</style></head>
<body>
<div class="col"><div class="sw" style="background:var(--amethyst)"></div><div class="soft" style="background:var(--amethyst-soft)"></div><div class="n">amethyst <span class="v">#7C6A99</span></div></div>
<div class="col"><div class="sw" style="background:var(--lilac)"></div><div class="soft" style="background:var(--lilac-soft)"></div><div class="n">lilac <span class="v">#AB92BF</span></div></div>
<div class="col"><div class="sw" style="background:var(--berry)"></div><div class="soft" style="background:var(--berry-soft)"></div><div class="n">berry <span class="v">#C75C86</span></div></div>
<div class="col"><div class="sw" style="background:var(--gold)"></div><div class="soft" style="background:var(--gold-soft)"></div><div class="n">caramel <span class="v">#C08552</span></div></div>
</body></html>
