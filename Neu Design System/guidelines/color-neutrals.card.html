<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals" subtitle="White always (light) · true black (dark) · dolphin ink" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--paper);font-family:var(--font-body);padding:20px;display:flex;gap:14px}
.sw{flex:1;height:110px;border-radius:var(--r-md);border:1px solid var(--line);display:flex;flex-direction:column;justify-content:flex-end;padding:10px}
.n{font-size:12px;font-weight:600;color:var(--ink)}.v{font-family:var(--font-mono);font-size:11px;color:var(--ink-3)}</style></head>
<body>
<div class="sw" style="background:var(--paper)"><div class="n">paper</div><div class="v">#FFFFFF</div></div>
<div class="sw" style="background:var(--paper-sink)"><div class="n">paper-sink</div><div class="v">#F6F4F9</div></div>
<div class="sw" style="background:var(--surface-2)"><div class="n">surface-2</div><div class="v">#FAF8FC</div></div>
<div class="sw" style="background:var(--ink);border:none"><div class="n" style="color:var(--ink-inv)">ink</div><div class="v" style="color:#B7AECB">#2E2440</div></div>
<div class="sw" style="background:var(--ink-2);border:none"><div class="n" style="color:#fff">ink-2</div><div class="v" style="color:#E7E0F0">#655A7C</div></div>
</body></html>
