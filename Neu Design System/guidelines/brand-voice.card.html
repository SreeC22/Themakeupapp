<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--paper);font-family:var(--font-body);padding:22px;color:var(--ink)}
.q{font-family:var(--font-display);font-style:italic;font-size:26px;line-height:1.2;color:var(--ink);max-width:600px}
.q b{font-style:normal;color:var(--amethyst-deep)}
.pair{display:flex;gap:14px;margin-top:18px}
.col{flex:1;border-radius:var(--r-md);padding:12px 14px;font-size:13px;line-height:1.45}
.yes{background:var(--amethyst-soft);color:var(--amethyst-deep)}
.no{background:var(--paper-sink);color:var(--ink-3)}
.tag{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:4px}</style></head>
<body>
<div class="q">"Their foundation that <b>didn't oxidize</b>. Their SPF that left <b>no cast</b>. You see what works on skin like yours."</div>
<div class="pair">
<div class="col yes"><span class="tag">We say</span>skin like yours · your tone twins · we worked out your undertone</div>
<div class="col no"><span class="tag">Not</span>flattering for all skin types · universally beautiful · one-size-fits-all</div>
</div>
</body></html>
