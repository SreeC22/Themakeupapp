<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-body);display:flex;height:200px}
.a{flex:1.3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--paper)}
.b{flex:1;display:flex;align-items:center;justify-content:center;gap:14px;background:#000}
.icons{display:flex;gap:12px;align-items:center}
.icons img{width:46px;height:46px;border-radius:11px}
.lock{height:40px}</style></head>
<body>
<div class="a">
  <img class="lock" src="../assets/logo.svg">
  <div class="icons"><img src="../assets/neu-icon.svg"><img src="../assets/logomark.svg" style="border-radius:0"></div>
</div>
<div class="b"><img src="../assets/neu-icon-dark.svg" style="width:56px;height:56px;border-radius:13px"><img src="../assets/logo-reversed.svg" style="width:200px;height:auto"></div>
</body></html>
