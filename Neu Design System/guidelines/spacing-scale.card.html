<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--paper);padding:20px 24px;font-family:var(--font-mono);display:flex;gap:14px;align-items:flex-end}
.c{display:flex;flex-direction:column;align-items:center;gap:8px}
.b{background:var(--amethyst-soft);border:1px solid var(--amethyst);border-radius:var(--r-xs)}
.l{font-size:10px;color:var(--ink-3)}</style></head>
<body>
<div class="c"><div class="b" style="width:4px;height:4px"></div><span class="l">1·4</span></div>
<div class="c"><div class="b" style="width:8px;height:8px"></div><span class="l">2·8</span></div>
<div class="c"><div class="b" style="width:12px;height:12px"></div><span class="l">3·12</span></div>
<div class="c"><div class="b" style="width:16px;height:16px"></div><span class="l">4·16</span></div>
<div class="c"><div class="b" style="width:24px;height:24px"></div><span class="l">6·24</span></div>
<div class="c"><div class="b" style="width:32px;height:32px"></div><span class="l">7·32</span></div>
<div class="c"><div class="b" style="width:40px;height:40px"></div><span class="l">8·40</span></div>
<div class="c"><div class="b" style="width:56px;height:56px"></div><span class="l">9·56</span></div>
<div class="c"><div class="b" style="width:72px;height:72px"></div><span class="l">10·72</span></div>
</body></html>
