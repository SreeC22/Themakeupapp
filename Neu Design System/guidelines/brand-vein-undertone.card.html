<!-- @dsCard group="Brand" viewport="700x180" name="Vein test → undertone" subtitle="The classic wrist-vein read the quiz mirrors: cool / neutral / warm" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--paper);font-family:var(--font-body);padding:22px;color:var(--ink);display:flex;gap:16px}
.c{flex:1;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.pair{display:flex}
.pair span{width:34px;height:34px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.pair span:last-child{margin-left:-12px}
.n{font-size:14px;font-weight:600;color:var(--ink)}
.v{font-size:12px;color:var(--ink-2);margin-top:-4px}
.t{font-family:var(--font-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}</style></head>
<body>
<div class="c"><div class="pair"><span style="background:var(--vein-purple)"></span><span style="background:var(--vein-blue)"></span></div><div class="n">Cool</div><div class="v">Blue or purple veins</div></div>
<div class="c"><div class="pair"><span style="background:var(--vein-blue)"></span><span style="background:var(--vein-teal)"></span></div><div class="n">Neutral</div><div class="v">Blue-green veins</div></div>
<div class="c"><div class="pair"><span style="background:var(--vein-green)"></span><span style="background:var(--vein-olive)"></span></div><div class="n">Warm</div><div class="v">Green or olive veins</div></div>
</body></html>
