<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--paper);padding:24px;font-family:var(--font-mono);display:flex;gap:28px;align-items:center;justify-content:center}
.c{display:flex;flex-direction:column;align-items:center;gap:12px}
.b{width:120px;height:74px;background:var(--surface);border-radius:var(--r-md)}
.l{font-size:10px;color:var(--ink-3)}</style></head>
<body>
<div class="c"><div class="b" style="box-shadow:var(--shadow-sm)"></div><span class="l">shadow-sm</span></div>
<div class="c"><div class="b" style="box-shadow:var(--shadow-md)"></div><span class="l">shadow-md</span></div>
<div class="c"><div class="b" style="box-shadow:var(--shadow-lg)"></div><span class="l">shadow-lg</span></div>
</body></html>
