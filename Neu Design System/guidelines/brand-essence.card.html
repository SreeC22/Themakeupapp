<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--paper);font-family:var(--font-body);color:var(--ink);display:flex}
  .pane{flex:1;padding:24px 28px}
  .div{width:1px;background:var(--line);margin:20px 0}
  .lab{font-family:var(--font-body);font-weight:600;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-2);margin:0 0 14px}
  .aa{font-weight:500;font-size:74px;line-height:.9;letter-spacing:-.03em;color:var(--ink);float:left;margin:0 20px 0 0}
  .nm{font-weight:500;font-size:19px;color:var(--ink);margin:2px 0 0}
  .wt{font-weight:400;font-size:14px;color:var(--ink-2);margin:0 0 8px}
  .set{font-weight:400;font-size:13px;letter-spacing:.04em;color:var(--ink-2);line-height:1.5;word-break:break-word}
  .set .low{color:var(--ink-3)}
  .essence{font-weight:500;font-size:17px;color:var(--ink);letter-spacing:.01em;display:flex;flex-wrap:wrap;gap:0 12px;margin-bottom:20px}
  .essence span{white-space:nowrap}
  .essence i{color:var(--line-strong);font-style:normal}
  .copy{font-weight:400;font-size:15px;line-height:1.55;color:var(--ink-2);max-width:380px}
  .copy b{color:var(--ink);font-weight:600}
</style></head>
<body>
  <div class="pane">
    <p class="lab">Typography</p>
    <div class="aa">Aa</div>
    <div class="nm">Circular Corner &middot; Medium</div>
    <div class="wt">Poppins substitute until licensed</div>
    <div class="set">ABCDEFGHIJKLMNOPQRSTUVWXYZ<br><span class="low">abcdefghijklmnopqrstuvwxyz</span><br><span class="low">0123456789</span></div>
  </div>
  <div class="div"></div>
  <div class="pane">
    <p class="lab">Brand Essence</p>
    <div class="essence"><span>Personal</span><i>|</i><span>Inclusive</span><i>|</i><span>Smart</span><i>|</i><span>Modern</span></div>
    <p class="copy">Neu uses <b>real people</b> and <b>real matches</b> to help you discover what works for you — confidently and effortlessly.</p>
  </div>
</body></html>
