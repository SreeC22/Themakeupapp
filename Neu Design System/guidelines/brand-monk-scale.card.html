<!-- @dsCard group="Brand" viewport="700x170" name="Monk Skin Tone Scale" subtitle="The 10-tone hero motif — every surface is filtered through your placement" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--paper);font-family:var(--font-body);padding:20px}
.row{display:flex;gap:6px}
.t{flex:1;height:96px;border-radius:var(--r-sm);position:relative;border:1px solid rgba(42,31,24,.08)}
.c{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-family:var(--font-mono);font-size:10px;color:var(--ink-2)}
.t.dark .c{color:rgba(255,255,255,.8)}
.cap{margin-top:12px;font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}</style></head>
<body>
<div class="row">
<div class="t" style="background:var(--mst-1)"><div class="c">01</div></div>
<div class="t" style="background:var(--mst-2)"><div class="c">02</div></div>
<div class="t" style="background:var(--mst-3)"><div class="c">03</div></div>
<div class="t" style="background:var(--mst-4)"><div class="c">04</div></div>
<div class="t" style="background:var(--mst-5)"><div class="c">05</div></div>
<div class="t dark" style="background:var(--mst-6)"><div class="c">06</div></div>
<div class="t dark" style="background:var(--mst-7)"><div class="c">07</div></div>
<div class="t dark" style="background:var(--mst-8)"><div class="c">08</div></div>
<div class="t dark" style="background:var(--mst-9)"><div class="c">09</div></div>
<div class="t dark" style="background:var(--mst-10)"><div class="c">10</div></div>
</div>
<div class="cap">--mst-1 … --mst-10 · light → deep</div>
</body></html>
