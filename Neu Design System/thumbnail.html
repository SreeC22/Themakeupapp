<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="./styles.css">
<style>
  html,body{margin:0;width:1280px;height:854px;overflow:hidden}
  .wrap{display:flex;width:1280px;height:854px}
  .main{flex:1;background:var(--amethyst);display:flex;align-items:center;justify-content:center}
  .mark{display:flex;align-items:center;gap:36px}
  .icon{width:190px;height:190px;border-radius:44px;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.18)}
  .word{font-family:var(--font-display);font-weight:500;font-size:180px;line-height:1;letter-spacing:-.02em;color:#fff}
  .strip{width:300px;display:flex;flex-direction:column}
  .strip div{flex:1}
</style></head>
<body>
<div class="wrap">
  <div class="main"><div class="mark"><img class="icon" src="assets/neu-icon.svg"><div class="word">neu</div></div></div>
  <div class="strip">
    <div style="background:var(--lilac)"></div>
    <div style="background:var(--berry)"></div>
    <div style="background:var(--amethyst-deep)"></div>
    <div style="background:var(--ink)"></div>
  </div>
</div>
</body></html>
