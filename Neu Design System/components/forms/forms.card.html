<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--paper);font-family:var(--font-body);padding:22px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.lab{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);width:100%;margin:0 0 2px}</style></head>
<body><div id="root"></div>
<script type="text/babel">
const { Button, Chip, Input, SegmentedControl, QuizOption } = window.NeuDesignSystem_32f7fb;
function Demo(){
  const [seg,setSeg]=React.useState('Face');
  const [q,setQ]=React.useState(true);
  return (<div>
    <div className="row"><span className="lab">Button — primary / quiet / soft / ghost</span>
      <Button>Take the quiz</Button><Button variant="quiet">Save</Button>
      <Button variant="soft">Retake</Button><Button variant="ghost">Skip</Button>
      <Button size="sm">Small</Button><Button disabled>Disabled</Button></div>
    <div className="row"><span className="lab">Chip — with tone swatches</span>
      <Chip selected swatch="var(--tone-olive)">Olive</Chip><Chip swatch="var(--tone-warm)">Warm</Chip>
      <Chip>Foundation</Chip><Chip>SPF</Chip><Chip>Blush</Chip></div>
    <div className="row"><span className="lab">SegmentedControl</span>
      <SegmentedControl options={['Face','Lips','Eyes']} value={seg} onChange={setSeg}/></div>
    <div className="row"><span className="lab">Input</span>
      <Input pill placeholder="Search foundations…" style={{width:280}}/></div>
    <div className="row"><span className="lab">QuizOption</span>
      <div style={{display:'flex',gap:10,width:'100%'}}>
        <QuizOption selected sublabel="Silver suits me" swatch="var(--tone-cool)" onClick={()=>setQ(true)} style={{flex:1}}>Cool</QuizOption>
        <QuizOption sublabel="Gold suits me" swatch="var(--tone-warm)" onClick={()=>setQ(false)} style={{flex:1}}>Warm</QuizOption>
      </div></div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
