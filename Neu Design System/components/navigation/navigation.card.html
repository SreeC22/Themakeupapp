<!-- @dsCard group="Components" viewport="700x200" name="Navigation" subtitle="TabBar — iOS bottom navigation with translucent blur" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--paper-sink);font-family:var(--font-body);padding:30px;display:flex;justify-content:center}
.phone{width:360px;background:var(--paper);border-radius:24px;border:1px solid var(--line);overflow:hidden;box-shadow:var(--shadow-lg)}
.body{height:96px;display:flex;align-items:center;justify-content:center;color:var(--ink-3);font-family:var(--font-display);font-size:20px}</style></head>
<body><div id="root"></div>
<script type="text/babel">
const { TabBar } = window.NeuDesignSystem_32f7fb;
const I = n => <i data-lucide={n} style={{width:22,height:22}}></i>;
function Demo(){
  const [t,setT]=React.useState('feed');
  React.useEffect(()=>{lucide.createIcons();});
  return(<div className="phone">
    <div className="body">For You</div>
    <TabBar active={t} onChange={setT} items={[
      {key:'feed',label:'For You',icon:I('sparkles')},
      {key:'search',label:'Discover',icon:I('search')},
      {key:'saved',label:'Saved',icon:I('heart')},
      {key:'you',label:'You',icon:I('user')},
    ]}/>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
